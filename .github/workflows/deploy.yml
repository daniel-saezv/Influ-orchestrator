name: deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-pr-{0}', github.event.pull_request.number) || format('deploy-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validar y empaquetar
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Caché de gitleaks
        id: gitleaks-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/gitleaks
          key: gitleaks-8.22.1-linux-x64

      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.22.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/gitleaks"
          if [ ! -x "$HOME/gitleaks/gitleaks" ]; then
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
            tar -xzf /tmp/gitleaks.tgz -C /tmp
            install -m 755 /tmp/gitleaks "$HOME/gitleaks/gitleaks"
          fi
          sudo install -m 755 "$HOME/gitleaks/gitleaks" /usr/local/bin/gitleaks
          gitleaks detect --source . --config .gitleaks.toml --redact -v

      - name: Guard PUBLISHER_MODE mock y LIVE bloqueado
        run: node deploy/ci-safety-guard.mjs

      - name: Tests unitarios
        run: npm run test:unit

      - name: Tests acceptance (local)
        run: npm run test:acceptance -- --target local

      - name: UI npm ci
        working-directory: ui
        run: npm ci

      - name: Tests UI
        working-directory: ui
        run: |
          npm run lint
          npm run test:run
          npm run build

      - name: Guardar la UI construida
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

      - name: wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run

  deploy:
    name: Desplegar a producción
    needs: ci
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Recuperar la UI construida
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-dist
          path: ui/dist

      - name: Sincronizar registro D1 (migraciones ya aplicadas a mano)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node deploy/d1-migrations-sync.mjs --write
          npx wrangler d1 execute influ-poc-db --remote --file deploy/out/d1-migrations-sync.sql

      - name: Aplicar migraciones D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply influ-poc-db --remote

      - name: Crear el bucket R2 de producción si no existe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node deploy/ensure-r2-bucket.mjs production

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke /v1/health (Access + live bloqueado)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INFLU_CF_ACCESS_CLIENT_ID: ${{ secrets.INFLU_CF_ACCESS_CLIENT_ID }}
          INFLU_CF_ACCESS_CLIENT_SECRET: ${{ secrets.INFLU_CF_ACCESS_CLIENT_SECRET }}
        run: node deploy/smoke-health.mjs

  preview:
    name: Preview de la PR
    needs: ci
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Recuperar la UI construida
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-dist
          path: ui/dist

      - name: Crear la D1 de preview y aplicar las migraciones de la rama
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node deploy/ensure-preview-d1.mjs
          if grep -E '^database_name = "influ-poc-db"$' wrangler.preview-d1.toml; then
            echo "::error::la config de migraciones incluye la D1 de producción"
            exit 1
          fi
          npx wrangler d1 migrations apply influ-poc-db-preview --remote --config wrangler.preview-d1.toml

      - name: Crear el bucket R2 de preview si no existe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node deploy/ensure-r2-bucket.mjs preview

      - name: Subir la preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          npx wrangler preview --name "pr-${PR_NUMBER}" --message "PR ${PR_NUMBER} ${HEAD_SHA}" --json > /tmp/wrangler-preview.json
          node deploy/preview-url.mjs /tmp/wrangler-preview.json >> "$GITHUB_OUTPUT"

      - name: Comentar la URL y el SHA
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node deploy/preview-pr-comment.mjs

      - name: Comprobar que Access redirige al login
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          check() {
            local path="$1"
            local hdr body code loc
            hdr=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS -D "$hdr" -o "$body" -w '%{http_code}' --max-time 30 "${PREVIEW_URL}${path}")
            loc=$(grep -i '^location:' "$hdr" | head -1 || true)
            if [ "$code" = "302" ] && printf '%s' "$loc" | grep -q 'cloudflareaccess.com/cdn-cgi/access/login'; then
              echo "${path} redirige al login de Access"
              return 0
            fi
            echo "::error::${path} no redirige al login de Access (HTTP ${code})"
            exit 1
          }
          check /health
          check /v1/health

  preview-cleanup:
    name: Borrar preview de la PR
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Borrar la preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: node deploy/delete-worker-preview.mjs