name: secrets-guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-tracked-secrets:
    name: Archivos sensibles no versionados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Comprobar que no hay secretos en el índice de git
        shell: bash
        run: |
          set -euo pipefail
          forbidden=0
          while IFS= read -r path; do
            case "$path" in
              deploy/out/secrets.js)
                echo "::error::No versionar $path (generado por deploy/build.mjs secrets)."
                forbidden=1
                ;;
              */secrets.json|secrets.json)
                echo "::error::No versionar $path."
                forbidden=1
                ;;
              *.pem|*.key)
                echo "::error::No versionar clave privada: $path"
                forbidden=1
                ;;
              .dev.vars|.env|.env.*)
                if [ "$path" != ".env.example" ]; then
                  echo "::error::No versionar $path."
                  forbidden=1
                fi
                ;;
            esac
          done < <(git ls-files)

          if [ "$forbidden" -ne 0 ]; then
            exit 1
          fi
          echo "Ningún archivo sensible aparece en git ls-files."

  gitleaks:
    name: gitleaks (historial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Caché de gitleaks
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/gitleaks
          key: gitleaks-8.22.1-linux-x64

      - name: Instalar gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.22.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/gitleaks"
          if [ ! -x "$HOME/gitleaks/gitleaks" ]; then
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
            tar -xzf /tmp/gitleaks.tgz -C /tmp
            install -m 755 /tmp/gitleaks "$HOME/gitleaks/gitleaks"
          fi
          sudo install -m 755 "$HOME/gitleaks/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Escanear historial
        shell: bash
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v