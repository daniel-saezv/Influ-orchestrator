name: secrets-guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-tracked-secrets:
    name: Archivos sensibles no versionados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar que no hay secretos en el índice de git
        run: |
          set -euo pipefail
          forbidden=0
          while IFS= read -r path; do
            case "$path" in
              deploy/out/secrets.js)
                echo "::error::No versionar $path (generado por deploy/build.mjs secrets)."
                forbidden=1
                ;;
              */secrets.json|secrets.json)
                echo "::error::No versionar $path."
                forbidden=1
                ;;
              *.pem|*.key)
                echo "::error::No versionar clave privada: $path"
                forbidden=1
                ;;
              wrangler.toml)
                echo "::error::No versionar $path (suele usarse con secretos locales)."
                forbidden=1
                ;;
              .dev.vars|.env|.env.*)
                if [ "$path" != ".env.example" ]; then
                  echo "::error::No versionar $path."
                  forbidden=1
                fi
                ;;
            esac
          done < <(git ls-files)

          if [ "$forbidden" -ne 0 ]; then
            exit 1
          fi
          echo "Ningún archivo sensible aparece en git ls-files."

  gitleaks:
    name: gitleaks (historial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}